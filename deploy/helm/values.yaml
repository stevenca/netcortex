# =============================================================================
# NetCortex Helm Chart — Default Values
# =============================================================================
# Override with -f values-local.yaml or --set for environment-specific config.
# Sensitive values (AWS keys, etc.) are NEVER stored here — supply them via
# existingSecret or a separate values override that you keep out of git.
# =============================================================================

nameOverride: ""
fullnameOverride: ""

# -----------------------------------------------------------------------------
# Image
# -----------------------------------------------------------------------------
image:
  repository: localhost:32000/netcortex   # microk8s local registry default
  tag: latest
  pullPolicy: Always

imagePullSecrets: []

# -----------------------------------------------------------------------------
# Bootstrap secret (Phase 1 — only these land in the environment)
# All other config/credentials are pulled from the secret backend at startup.
#
# Option A (recommended): create the Secret out-of-band and set existingSecret.
#   kubectl create secret generic netcortex-bootstrap \
#     --from-env-file=.env -n netcortex
#
# Option B: let the chart manage it (store overrides in a gitignored file).
# -----------------------------------------------------------------------------
existingSecret: ""   # set to the Secret name to use Option A

secretBackend: aws_sm

aws:
  region: us-east-1
  secretPrefix: netcortex
  # Set these only when NOT using an IAM instance role / IRSA / pod identity.
  # Prefer existingSecret so these never appear in Helm release history.
  accessKeyId: ""
  secretAccessKey: ""
  sessionToken: ""
  # For LocalStack / dev override:
  # endpointUrl: http://localstack:4566

# -----------------------------------------------------------------------------
# Global container security context
# Designed to satisfy OpenShift "restricted" SCC:
#   - runAsNonRoot: true (no UID specified — OCP assigns one from namespace range)
#   - allowPrivilegeEscalation: false
#   - capabilities.drop: ALL
#   - seccompProfile: RuntimeDefault
# Note: redis and neo4j images use fixed UIDs (999 / 7474). On OCP restricted
# SCC those may be rejected; grant anyuid SCC to the SA or use Bitnami images.
# -----------------------------------------------------------------------------
securityContext:
  runAsNonRoot: true
  # UID 1001 matches the netcortex user in the Dockerfile.
  # On OpenShift restricted SCC the platform overrides this with a namespace-
  # assigned UID; set to null/omit via values override when targeting OCP.
  runAsUser: 1001
  allowPrivilegeEscalation: false
  capabilities:
    drop: ["ALL"]
  seccompProfile:
    type: RuntimeDefault

# -----------------------------------------------------------------------------
# Web — main FastAPI / MCP server
# -----------------------------------------------------------------------------
web:
  replicas: 1
  resources:
    requests:
      cpu: "200m"
      memory: "256Mi"
    limits:
      cpu: "1000m"
      memory: "1Gi"
  # Extra environment variables (non-secret)
  extraEnv: []
  # - name: LOG_LEVEL
  #   value: DEBUG

# -----------------------------------------------------------------------------
# SAML SSO (0.8.0-dev11) — gates human UI/API access behind an IdP login.
# All values here are NON-SECRET (IdP URLs + the IdP's public signing cert),
# so they live in values, not the secret backend. They are injected as
# NETCORTEX_SAML_* env on the web pod and can still be overridden by the
# netcortex/core secret if a key is present there. The optional SP private
# key (for signing AuthnRequests) is the only sensitive piece and is read
# from the secret backend only.
# -----------------------------------------------------------------------------
saml:
  enabled: false
  # Public https origin of this app. Empty → defaults to https://<ingress.hostname>.
  spBaseUrl: ""
  # SP entityId. Empty → defaults to <spBaseUrl>/saml/metadata.
  spEntityId: ""
  idp:
    entityId: ""          # IdP Issuer / entityID from the IdP metadata
    ssoUrl: ""            # IdP SingleSignOnService Location
    sloUrl: ""            # IdP SingleLogoutService (optional; blank if none)
    x509cert: ""          # IdP signing cert, single-line base64 (public)
  # Optional coarse authorization. Empty = any authenticated IdP user.
  allowedEmailDomains: []
  allowedGroups: []
  attrGroups: "groups"    # SAML attribute name carrying group membership

# -----------------------------------------------------------------------------
# Session policy for SAML-authenticated UI sessions (server-side, Redis).
# -----------------------------------------------------------------------------
session:
  cookieName: "nc_session"
  cookieSecure: true            # set false ONLY for local http dev
  idleTimeoutSeconds: 1800      # 30 min
  absoluteTimeoutSeconds: 28800 # 8 h

# -----------------------------------------------------------------------------
# Worker — Celery async task runner
# -----------------------------------------------------------------------------
worker:
  enabled: true
  replicas: 1
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  extraEnv: []

# -----------------------------------------------------------------------------
# Redis
# -----------------------------------------------------------------------------
redis:
  enabled: true
  image:
    repository: redis
    tag: "7-alpine"
  resources:
    requests:
      cpu: "100m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "128Mi"
  persistence:
    size: 1Gi
    storageClass: ""   # "" = cluster default

# -----------------------------------------------------------------------------
# Neo4j
# -----------------------------------------------------------------------------
neo4j:
  enabled: true
  image:
    repository: neo4j
    tag: "5-community"
  auth:
    # Set to true and provide password for production.
    # false → NEO4J_AUTH=none (dev only)
    enabled: false
    password: ""
  resources:
    requests:
      cpu: "500m"
      memory: "1Gi"
    limits:
      cpu: "2000m"
      memory: "2Gi"
  persistence:
    data:
      size: 10Gi
      storageClass: ""
    logs:
      size: 1Gi
      storageClass: ""

# -----------------------------------------------------------------------------
# NATS — the thalamus (event bus) introduced in 0.8.0.
#
# Single-node JetStream-enabled deployment. Adapters publish SensoryEvents
# here; reflex handlers, the correlator, and (later) the stream bridge for
# external agents all subscribe. See docs/architecture/brain.md.
#
# HA clustering (3 raft-replicated nodes) lands in a later 0.8.x patch when
# event volume justifies the operational complexity.
# -----------------------------------------------------------------------------
nats:
  enabled: true
  image:
    repository: nats
    tag: "2.11-alpine"
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  persistence:
    size: 2Gi
    storageClass: ""   # "" = cluster default
  jetstream:
    # File-backed JetStream store cap. Keep aligned with persistence.size
    # (leave 20-30% headroom for indices and overhead).
    maxFileStore: "1GB"

# -----------------------------------------------------------------------------
# NetCortex app data volume (/app/data)
# -----------------------------------------------------------------------------
persistence:
  data:
    size: 5Gi
    storageClass: ""

# -----------------------------------------------------------------------------
# Service
# -----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 8000

# -----------------------------------------------------------------------------
# Streaming telemetry
# HTTP push MDT is handled inline by the web container on port 8000.
# gRPC dial-out MDT (gNMI Subscribe) uses a separate service on port 57500.
# The gRPC receiver is a future sidecar/deployment; setting enabled: true
# creates the Service so DNS and firewall rules can be set up in advance.
# -----------------------------------------------------------------------------
telemetry:
  grpc:
    enabled: true
    port: 57500      # IANA / Cisco standard for gNMI dial-out

# -----------------------------------------------------------------------------
# Ingress
# On microk8s: className "nginx" (Traefik handles nginx/public/traefik classes)
# On OpenShift: className "" and let the ingress operator pick it up, or use
#               a Route resource instead (add to templates/ when targeting OCP).
# -----------------------------------------------------------------------------
ingress:
  enabled: true
  className: "nginx"
  hostname: "netcortex.local"
  tls:
    enabled: false
    secretName: "netcortex-tls"
  annotations: {}
  # OpenShift Route example (add when targeting OCP):
  # annotations:
  #   route.openshift.io/termination: edge

  # ---------------------------------------------------------------------------
  # Public exposure surface (0.8.0-dev10 security hardening)
  # ---------------------------------------------------------------------------
  # exposeApi=false (default, SECURE): the public ingress serves ONLY the
  # webhook/telemetry receiver and health paths below. The status UI, the
  # topology/inventory API (/api/*), /metrics, and the MCP endpoint stay
  # cluster-internal. Reach them with `kubectl port-forward svc/<name>-web
  # 8000:8000` or a separate internal-only ingress.
  #
  # exposeApi=true: serve the WHOLE app on this host. Only do this on a
  # trusted network, or set `api_secret` in the core secret so /api,
  # /metrics, /mcp, and the UI require `Authorization: Bearer <api_secret>`.
  exposeApi: false
  publicPaths:
    - /webhooks
    - /ingest
    - /health

  # IP allow-lists (0.8.0-dev11). nginx whitelist-source-range, applied
  # per-ingress so the human UI and the machine receivers can have
  # different allowed sources.
  #
  # adminAllowSourceRanges: CIDRs permitted to reach the UI/API/MCP admin
  #   ingress (only created when exposeApi=true). Empty = no IP filter
  #   (rely on SAML SSO + api_secret). Set to your office/VPN egress.
  # webhookAllowSourceRanges: CIDRs permitted to reach /webhooks + /ingest.
  #   Empty = open (vendor clouds use dynamic IPs; HMAC/token is the
  #   control). Populate with vendor egress ranges to lock down later.
  adminAllowSourceRanges: []
    # - "203.0.113.0/24"     # office
    # - "198.51.100.7/32"    # admin VPN
  webhookAllowSourceRanges: []

  # Hard cap on request body size at the ingress (F3). Mirror the in-app
  # webhook_max_body_bytes (default 1 MiB).
  proxyBodySize: "1m"

  # Per-source rate limiting (defense-in-depth against webhook floods).
  rateLimit:
    enabled: true
    rps: 20            # requests/second per client IP
    connections: 10    # concurrent connections per client IP

# -----------------------------------------------------------------------------
# Service Account
# -----------------------------------------------------------------------------
serviceAccount:
  create: true
  name: ""
  annotations: {}
  # For IRSA (EKS) or Workload Identity (GKE/AKS):
  # annotations:
  #   eks.amazonaws.com/role-arn: arn:aws:iam::123456789012:role/netcortex

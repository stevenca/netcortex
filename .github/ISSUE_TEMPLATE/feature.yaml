name: Feature request / capability
description: A new capability, sensory input, policy, or bridge
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What can't be done today? Who is affected?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: How would this work? Cite docs/architecture/brain.md regions if applicable.
    validations:
      required: true
  - type: dropdown
    id: region
    attributes:
      label: Brain region (target component)
      options:
        - sensory / new adapter
        - sensory / webhook
        - sensory / trap
        - sensory / telemetry
        - thalamus / event bus
        - reflex
        - association
        - memory / semantic (Neo4j)
        - memory / episodic (Splunk)
        - memory / intent
        - memory / preference
        - hippocampus / consolidation
        - prefrontal / conductor
        - language / LLM router
        - motor / writeback
        - bridge / MCP
        - bridge / A2A
        - bridge / stream (SSE)
        - plasticity
        - policy library
        - other
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: risk
    attributes:
      label: Risk / blast radius
      description: What could break? What contracts does this touch?

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: ruff check
        # Narrowed rule set (E9, F, I) configured in pyproject.toml — see
        # docs/architecture/brain.md for the rationale on grandfathering the
        # legacy codebase during the brain refactor.
        run: ruff check netcortex tests tools
      - name: ruff format --check
        # Non-blocking for now: the legacy codebase was not historically
        # auto-formatted, and running `ruff format` against it produces a
        # multi-thousand-line diff that would obscure the brain refactor's
        # commits. New modules under netcortex/contracts/ etc. ARE expected
        # to be format-clean; we will flip this to required once the
        # legacy modules have been touched by their respective refactors.
        run: ruff format --check netcortex tests tools || true

  typecheck:
    name: Type check (mypy --strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: mypy
        # NOTE: existing codebase not yet 100% mypy-strict-clean.
        # We type-check the contracts and tools surfaces strictly,
        # and run the rest in best-effort mode until the brain refactor
        # tightens module boundaries (tracked in docs/architecture/brain.md).
        run: |
          mypy --strict tools/ || true
          mypy netcortex/ || true

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (unit)
        run: |
          pytest tests/ \
            --ignore=tests/golden \
            --ignore=tests/contracts \
            --ignore=tests/integration \
            -q

  golden:
    name: Golden snapshot tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (golden)
        run: |
          if [ -d tests/golden ] && find tests/golden -name 'test_*.py' | grep -q .; then
            pytest tests/golden/ -q
          else
            echo "No golden tests yet — skeleton only."
          fi

  contracts:
    name: Contract tests (Protocol conformance)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (contracts)
        run: |
          if [ -d tests/contracts ] && find tests/contracts -name 'test_*.py' | grep -q .; then
            pytest tests/contracts/ -q
          else
            echo "No contract tests yet — skeleton only."
          fi

  replay:
    name: Recorded integration replay (offline)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pytest (replay, network blocked)
        env:
          # pytest-recording defaults to 'none' which forbids new HTTP.
          # We belt-and-suspenders this with a stub proxy that fails any
          # accidental egress.
          HTTP_PROXY: "http://127.0.0.1:1"
          HTTPS_PROXY: "http://127.0.0.1:1"
          NO_PROXY: "localhost,127.0.0.1"
        run: |
          if [ -d tests/integration ] && find tests/integration -name 'test_*.py' | grep -q .; then
            pytest tests/integration/ --record-mode=none -q
          else
            echo "No integration cassettes yet — skeleton only."
          fi

  security:
    name: Security lints
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: No self-rewrite lint
        run: python tools/lint_no_self_rewrite.py
      - name: No unsanitized cassettes
        run: python tools/lint_no_unsanitized_cassettes.py

  sbom:
    name: SBOM + dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: pip-audit
        run: pip-audit --strict --progress-spinner off || true
        # NOTE: non-blocking initially. Flip to required once we triage
        # existing advisories.
